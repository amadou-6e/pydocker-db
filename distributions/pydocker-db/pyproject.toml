[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pydocker-db"
version = "1.0.0"
description = "Convenience install name for py-dockerdb; Python database containers"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["py-dockerdb>=1.0.1,<2"]

[project.optional-dependencies]
graph = ["py-dockerdb[graph]>=1.0.1,<2"]
rag = ["py-dockerdb[rag]>=1.0.1,<2"]
test = ["py-dockerdb[test]>=1.0.1,<2"]

[project.urls]
Homepage = "https://github.com/amadou-6e/pydocker-db"

[tool.setuptools]
packages = []
